<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XD Maze</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=DM+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: the first-person view fills the screen. Glass controls float over it:
   settings on top, walking pad bottom-left, one row of buttons per extra axis bottom-right.
   One deliberate look (overexposed pastel dream), so no dark variant. */
:root {
  --ink: #3a2c58; --ink-soft: #6d5f8c; --haze: #f6e9f6; --glass: rgba(255, 255, 255, 0.62); --edge: rgba(58, 44, 88, 0.28);
  --ax2: #d18a00; --ax3: #d93a8c; --ax4: #2a7fd6; --ax5: #1f9a5c; --hint: #3a2c58;
  --display: "Cormorant Garamond", "Times New Roman", serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --mono: "DM Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--haze); color: var(--ink); font: 14px/1.4 var(--body);
  display: flex; flex-direction: column; gap: 8px; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  touch-action: manipulation; overflow: hidden;
}
#gl, #grain, #vig, #flash { position: fixed; inset: 0; width: 100%; height: 100%; }
#gl { display: block; filter: saturate(1.2) contrast(1.02); touch-action: none; }
#grain, #vig, #flash { pointer-events: none; }
#grain { opacity: 0.2; mix-blend-mode: multiply; }
#vig { background: radial-gradient(ellipse at center, rgba(255,255,255,0) 55%, rgba(255,246,252,0.5) 100%); }
#flash { background: #fff; opacity: 0; }
#flash.go { animation: flash 0.7s ease-out; }
@keyframes flash { 0% { opacity: 0.95; } 100% { opacity: 0; } }
.bar, .mid, .controls { position: relative; z-index: 1; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
h1 { font: italic 600 26px/1 var(--display); margin: 0 4px 0 0; text-shadow: 0 0 12px #fff; }
.bar label { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--ink); text-shadow: 0 0 6px #fff; }
select, .btn {
  font: 500 14px var(--body); color: var(--ink); background: var(--glass);
  border: 1px solid var(--edge); border-radius: 999px; min-height: 36px; padding: 0 12px;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.btn[aria-pressed="true"] { background: var(--ink); color: #fff; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.readout { margin-left: auto; display: flex; gap: 12px; font: 400 13px var(--mono); font-variant-numeric: tabular-nums;
  background: var(--glass); border-radius: 999px; padding: 6px 12px; color: var(--ink-soft); }
.readout b { color: var(--ink); font-weight: 500; }
.mid { flex: 1 1 0; min-height: 0; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
#caption { font: italic 600 30px/1.1 var(--display); color: #fff; text-shadow: 0 0 14px var(--ink), 0 0 3px var(--ink); opacity: 0; margin: 8px 0 0; }
#caption.go { animation: cap 2.4s ease-out; }
@keyframes cap { 0% { opacity: 0; } 15% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; } }
#map { width: min(34vw, 170px); aspect-ratio: 1; max-width: 100%; border-radius: 10px; background: var(--glass); border: 1px solid var(--edge); }
.controls { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.pad { display: grid; grid-template-columns: repeat(3, 58px); grid-auto-rows: 58px; gap: 6px; }
.axes { display: grid; grid-template-columns: repeat(2, 68px); grid-auto-rows: 50px; gap: 6px; }
.mv {
  --c: var(--ink);
  font: 500 17px var(--mono); color: var(--c); line-height: 1; background: var(--glass);
  border: 2px solid var(--c); border-radius: 16px; padding: 0;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
  .pad .mv { font-size: 26px; }
.mv:disabled { opacity: 0.25; }
.mv.next { background: var(--c); color: #fff; box-shadow: 0 0 18px #fff; }
.mv[data-axis="2"] { --c: var(--ax2); } .mv[data-axis="3"] { --c: var(--ax3); }
.mv[data-axis="4"] { --c: var(--ax4); } .mv[data-axis="5"] { --c: var(--ax5); }
.win { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  background: rgba(255, 244, 252, 0.8); text-align: center; padding: 16px; }
.win p { margin: 0; font: italic 600 44px/1.1 var(--display); text-wrap: balance; }
.win small { font: 400 14px var(--mono); color: var(--ink-soft); }
.win div { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
@media (max-width: 520px) {
  .pad { grid-template-columns: repeat(3, 48px); grid-auto-rows: 48px; }
  .axes { grid-template-columns: repeat(2, 56px); grid-auto-rows: 42px; }
  .mv { font-size: 15px; }
}
@media (max-height: 460px) { .axes { grid-auto-rows: 38px; } .pad { grid-auto-rows: 46px; } }
@media (prefers-reduced-motion: reduce) { #flash.go, #caption.go { animation-duration: 0.01s; } }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="grain"></div><div id="vig"></div><div id="flash"></div>

<div class="bar">
  <h1>XD Maze</h1>
  <label for="dim">次元<select id="dim"></select></label>
  <label for="size">一辺<select id="size"></select></label>
  <label for="algo">生成<select id="algo"><option value="dfs">DFS(長い道)</option><option value="wilson">Wilson(偏りなし)</option></select></label>
  <button class="btn" id="new" type="button">新しい迷路</button>
  <button class="btn" id="restart" type="button">最初から</button>
  <button class="btn" id="hint" type="button" aria-pressed="false">ヒント</button>
  <button class="btn" id="mapBtn" type="button" aria-pressed="true">地図</button>
  <div class="readout"><span>位置 <b id="coord"></b></span><span>手数 <b id="steps">0</b></span><span>最短 <b id="best">0</b></span></div>
</div>
<div class="mid">
  <p id="caption"></p>
  <canvas id="map" width="340" height="340"></canvas>
</div>
<div class="controls">
  <div class="pad">
    <button class="mv" id="tl" type="button" data-act="l" aria-label="左を向く">↰</button>
    <button class="mv" id="fw" type="button" data-act="f" aria-label="前へ進む">↑</button>
    <button class="mv" id="tr" type="button" data-act="r" aria-label="右を向く">↱</button>
    <span></span>
    <button class="mv" id="bk" type="button" data-act="b" aria-label="後ろへ下がる">↓</button>
  </div>
  <div class="axes">
    <button class="mv" id="m2n" type="button" data-axis="2" data-sign="-1" aria-label="下の階へ">z−</button><button class="mv" id="m2p" type="button" data-axis="2" data-sign="1" aria-label="上の階へ">z+</button>
    <button class="mv" id="m3n" type="button" data-axis="3" data-sign="-1">w−</button><button class="mv" id="m3p" type="button" data-axis="3" data-sign="1">w+</button>
    <button class="mv" id="m4n" type="button" data-axis="4" data-sign="-1">v−</button><button class="mv" id="m4p" type="button" data-axis="4" data-sign="1">v+</button>
    <button class="mv" id="m5n" type="button" data-axis="5" data-sign="-1">u−</button><button class="mv" id="m5p" type="button" data-axis="5" data-sign="1">u+</button>
  </div>
</div>
<div class="win" id="win" hidden>
  <p>おかえりなさい</p>
  <small id="winText"></small>
  <div><button class="btn" id="winNew" type="button">次の迷路</button><button class="btn" id="winAgain" type="button">同じ迷路をもう一度</button></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="core.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const MAX_SIZE = { 2: 12, 3: 6, 4: 5, 5: 4, 6: 3 };
  const AX = [0, 0, '#d18a00', '#d93a8c', '#2a7fd6', '#1f9a5c'];
  const NAMES = ['x', 'y', 'z', 'w', 'v', 'u'];
  const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const moveButtons = [...document.querySelectorAll('.mv')];
  let cfg = { n: 4, s: 4, algo: 'dfs', seed: 0 };
  let maze, pos, goal, steps, visited, best, face = 0, hint = false, showMap = true;
  let base = -1, world = null, cellSprites = new Map(), hiddenCell = -1;

  try { Object.assign(cfg, JSON.parse(localStorage.getItem('xdmaze') || '{}')); } catch (e) {}
  if (!MAX_SIZE[cfg.n]) cfg.n = 4;

  // ---- textures, drawn in code so the page needs no image files
  function tex(size, paint, repeat) {
    const c = document.createElement('canvas'); c.width = c.height = size;
    paint(c.getContext('2d'), size);
    const t = new THREE.CanvasTexture(c);
    if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
    return t;
  }
  const rand = mulberry32(7);
  const wallTex = tex(256, (g, S) => { // sky wallpaper with clouds and a white skirting board
    const sky = g.createLinearGradient(0, 0, 0, S);
    sky.addColorStop(0, '#7db7ff'); sky.addColorStop(0.75, '#d9ecff'); sky.addColorStop(1, '#fff3fb');
    g.fillStyle = sky; g.fillRect(0, 0, S, S);
    for (let c = 0; c < 9; c++) {
      const cx = rand() * S, cy = 30 + rand() * S * 0.6;
      for (let p = 0; p < 7; p++) {
        const x = cx + (rand() - 0.5) * 70, y = cy + (rand() - 0.5) * 16, r = 14 + rand() * 20;
        for (const ox of [-S, 0, S]) {
          const gr = g.createRadialGradient(x + ox, y, 0, x + ox, y, r);
          gr.addColorStop(0, 'rgba(255,255,255,0.95)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
          g.fillStyle = gr; g.fillRect(x + ox - r, y - r, r * 2, r * 2);
        }
      }
    }
    g.fillStyle = '#ffffff'; g.fillRect(0, S - 18, S, 18);
    g.fillStyle = 'rgba(70,50,130,0.6)'; g.fillRect(0, S - 21, S, 3);
    g.fillStyle = 'rgba(70,50,130,0.5)'; g.fillRect(0, 0, 4, S); g.fillRect(S - 4, 0, 4, S); g.fillRect(0, 0, S, 5);
  }, true);
  const floorTex = tex(128, (g, S) => { // soft checker tiles
    for (let y = 0; y < 2; y++) for (let x = 0; x < 2; x++) { g.fillStyle = (x + y) % 2 ? '#ee9fd0' : '#fffafd'; g.fillRect(x * S / 2, y * S / 2, S / 2, S / 2); }
    g.strokeStyle = 'rgba(90,70,140,0.18)'; g.lineWidth = 2; g.strokeRect(0, 0, S, S);
  }, true);
  const ceilTex = tex(128, (g, S) => { // a pale ceiling with one glowing panel
    g.fillStyle = '#efe6ff'; g.fillRect(0, 0, S, S);
    const gr = g.createRadialGradient(S / 2, S / 2, 4, S / 2, S / 2, S * 0.5);
    gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.5, 'rgba(255,255,230,0.8)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, S, S);
  }, true);
  const glowTex = tex(64, (g, S) => {
    const gr = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
    gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.25, 'rgba(255,255,255,0.95)'); gr.addColorStop(0.5, 'rgba(255,255,255,0.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, S, S);
  });
  const doorTex = tex(128, (g, S) => { // the exit: a door of light
    const gr = g.createRadialGradient(S / 2, S / 2, 6, S / 2, S / 2, S / 2);
    gr.addColorStop(0, 'rgba(255,250,200,1)'); gr.addColorStop(0.6, 'rgba(255,220,120,0.5)'); gr.addColorStop(1, 'rgba(255,220,120,0)');
    g.fillStyle = gr; g.fillRect(0, 0, S, S);
    g.fillStyle = '#ffffff'; g.fillRect(S * 0.36, S * 0.18, S * 0.28, S * 0.64);
    g.fillStyle = '#ffd24a'; g.beginPath(); g.arc(S * 0.58, S * 0.52, 3, 0, 6.3); g.fill();
  });
  $('grain').style.backgroundImage = 'url(' + (() => {
    const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'), d = g.createImageData(128, 128);
    for (let i = 0; i < d.data.length; i += 4) { const v = 150 + Math.random() * 105; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
    g.putImageData(d, 0, 0); return c.toDataURL();
  })() + ')';

  // ---- scene
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: false }); }
  catch (e) { $('caption').textContent = 'このブラウザでは 3D 表示(WebGL)が使えない。'; $('caption').style.opacity = 1; return; }
  const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(84, 1, 0.03, 40);
  scene.fog = new THREE.Fog(0xffffff, 1.2, 8);
  const mat = (map) => new THREE.MeshBasicMaterial({ map, vertexColors: true });
  const wallMat = mat(wallTex), floorMat = mat(floorTex), ceilMat = mat(ceilTex);
  const spriteMat = AX.map((c) => c ? new THREE.SpriteMaterial({ map: glowTex, color: c, transparent: true, depthWrite: false }) : null);
  const doorMat = new THREE.SpriteMaterial({ map: doorTex, transparent: true, depthWrite: false, fog: false });
  const beamGeo = new THREE.CylinderGeometry(0.03, 0.03, 1, 8, 1, true);
  const beamMat = new THREE.MeshBasicMaterial({ color: AX[2], transparent: true, opacity: 0.6, depthWrite: false });

  function quads() { // collects quads; the normal u × v must point into the room
    const p = [], uv = [], col = [], idx = [];
    return {
      add(o, u, v, shade) {
        const b = p.length / 3;
        p.push(o[0], o[1], o[2], o[0] + u[0], o[1] + u[1], o[2] + u[2], o[0] + u[0] + v[0], o[1] + u[1] + v[1], o[2] + u[2] + v[2], o[0] + v[0], o[1] + v[1], o[2] + v[2]);
        uv.push(0, 0, 1, 0, 1, 1, 0, 1);
        for (let i = 0; i < 4; i++) col.push(shade, shade, shade);
        idx.push(b, b + 1, b + 2, b, b + 2, b + 3);
      },
      mesh(material) {
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
        g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
        g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
        g.setIndex(idx);
        return new THREE.Mesh(g, material);
      },
    };
  }

  // The view shows one 3D slice: x,y are the floor plan, z is height. w,v,u pick which slice.
  function buildSlice() {
    const n = cfg.n, s = cfg.s, st = maze.stride, cm = maze.canMove;
    if (world) { scene.remove(world); world.traverse((o) => { if (o.isMesh && o.geometry !== beamGeo) o.geometry.dispose(); }); }
    world = new THREE.Group(); cellSprites = new Map(); hiddenCell = -1;
    base = 0;
    for (let k = 3; k < n; k++) base += maze.coord(pos, k) * st[k];
    const W = quads(), F = quads(), C = quads(), levels = n >= 3 ? s : 1;
    for (let zl = 0; zl < levels; zl++) for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) {
      const i = base + x + y * st[1] + (n >= 3 ? zl * st[2] : 0), X = x, Y = zl, Z = y;
      if (!cm(i, 0, 1)) W.add([X + 0.5, Y - 0.5, Z - 0.5], [0, 0, 1], [0, 1, 0], 1);
      if (!cm(i, 0, -1)) W.add([X - 0.5, Y - 0.5, Z + 0.5], [0, 0, -1], [0, 1, 0], 1);
      if (!cm(i, 1, 1)) W.add([X + 0.5, Y - 0.5, Z + 0.5], [-1, 0, 0], [0, 1, 0], 0.8);
      if (!cm(i, 1, -1)) W.add([X - 0.5, Y - 0.5, Z - 0.5], [1, 0, 0], [0, 1, 0], 0.8);
      if (!(n >= 3 && cm(i, 2, -1))) F.add([X - 0.5, Y - 0.5, Z + 0.5], [1, 0, 0], [0, 0, -1], 1);
      if (!(n >= 3 && cm(i, 2, 1))) C.add([X - 0.5, Y + 0.5, Z - 0.5], [1, 0, 0], [0, 0, 1], 1);
      else { const beam = new THREE.Mesh(beamGeo, beamMat); beam.position.set(X, Y + 0.5, Z); world.add(beam); }
      // lights for the other axes: high = plus, low = minus, one color per axis
      const OFF = [0, 0, 0, [-0.26, -0.26], [0.26, -0.26], [0, 0.3]];
      for (let k = 3; k < n; k++) for (const sg of [-1, 1]) if (cm(i, k, sg)) {
        const sp = new THREE.Sprite(spriteMat[k]);
        sp.position.set(X + OFF[k][0], Y + sg * 0.24, Z + OFF[k][1]); sp.scale.set(0.3, 0.3, 1);
        world.add(sp);
        if (!cellSprites.has(i)) cellSprites.set(i, []);
        cellSprites.get(i).push(sp);
      }
    }
    world.add(W.mesh(wallMat), F.mesh(floorMat), C.mesh(ceilMat));
    if (goal - base < (n >= 4 ? st[3] : maze.total)) {
      const door = new THREE.Sprite(doorMat);
      door.position.set(maze.coord(goal, 0), n >= 3 ? maze.coord(goal, 2) : 0, maze.coord(goal, 1)); door.scale.set(0.95, 0.95, 1);
      world.add(door);
    }
    scene.add(world);
    // every slice has its own light
    const c = (k) => (k < n ? maze.coord(pos, k) : 0);
    const hue = ((318 + 67 * c(3) + 131 * c(4) + 29 * c(5)) % 360) / 360;
    scene.fog.color.setHSL(hue, 0.8, 0.84); renderer.setClearColor(scene.fog.color);
    wallMat.color.setHSL(hue, 0.9, 0.93); ceilMat.color.setHSL(hue, 0.9, 0.95); floorMat.color.setHSL((hue + 0.08) % 1, 0.9, 0.93);
  }

  // ---- camera: glides between cell centres
  const cam = { x: 0, y: 0, z: 0, yaw: 0 }, from = { x: 0, y: 0, z: 0, yaw: 0 };
  let t0 = -1e9;
  const DUR = 190;
  const target = () => ({ x: maze.coord(pos, 0), y: cfg.n >= 3 ? maze.coord(pos, 2) : 0, z: maze.coord(pos, 1), yaw: face * Math.PI / 2 });
  function glide(snap) { Object.assign(from, snap ? target() : cam); t0 = snap ? -1e9 : performance.now(); }
  function frame(now) {
    const to = target(), k = Math.min(1, (now - t0) / DUR), e = k * k * (3 - 2 * k);
    for (const key of ['x', 'y', 'z', 'yaw']) cam[key] = from[key] + (to[key] - from[key]) * e;
    const sway = calm ? 0 : Math.sin(now / 1900) * 0.025, bob = calm ? 0 : Math.sin(now / 1300) * 0.012;
    const ex = cam.x - Math.cos(cam.yaw) * 0.36, ez = cam.z - Math.sin(cam.yaw) * 0.36;
    camera.position.set(ex, cam.y + bob, ez);
    camera.lookAt(ex + Math.cos(cam.yaw + sway), cam.y + bob, ez + Math.sin(cam.yaw + sway));
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  function resize() {
    const w = window.innerWidth, h = window.innerHeight, q = 0.55 * Math.min(window.devicePixelRatio || 1, 2); // deliberately low resolution
    renderer.setSize(Math.max(2, Math.round(w * q)), Math.max(2, Math.round(h * q)), false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }

  // ---- game state
  function fillSelects() {
    $('dim').innerHTML = [2, 3, 4, 5, 6].map((d) => `<option value="${d}">${d}次元</option>`).join('');
    $('dim').value = cfg.n;
    cfg.s = Math.max(2, Math.min(cfg.s, MAX_SIZE[cfg.n]));
    let h = '';
    for (let s = 2; s <= MAX_SIZE[cfg.n]; s++) h += `<option value="${s}">${s}</option>`;
    $('size').innerHTML = h; $('size').value = cfg.s; $('algo').value = cfg.algo;
  }
  function build(newSeed, saved) {
    if (newSeed) cfg.seed = (Math.random() * 4294967296) >>> 0;
    try { localStorage.setItem('xdmaze', JSON.stringify({ n: cfg.n, s: cfg.s, algo: cfg.algo })); } catch (e) {}
    maze = createMaze(Array(cfg.n).fill(cfg.s), cfg.seed, cfg.algo);
    goal = maze.total - 1;
    best = shortestPath(maze, 0, goal).length - 1;
    visited = new Uint8Array(maze.total);
    pos = 0; steps = 0; face = 0;
    if (saved && saved.pos < maze.total) { pos = saved.pos; steps = saved.steps; face = saved.face || 0; (saved.trail || []).forEach((i) => { visited[i] = 1; }); }
    visited[pos] = 1;
    if (!saved || saved.face === undefined) for (let d = 3; d >= 0; d--) if (maze.canMove(0, d & 1, d < 2 ? 1 : -1)) face = d; // start facing an open way
    for (const b of moveButtons) if (b.dataset.axis) b.hidden = +b.dataset.axis >= cfg.n;
    buildSlice(); glide(true); refresh();
  }
  const dirOf = () => ((face % 4) + 4) % 4; // 0:+x 1:+y 2:-x 3:-y
  function refresh() {
    const d = dirOf(), fk = d & 1, fs = d < 2 ? 1 : -1;
    const path = hint ? shortestPath(maze, pos, goal) : null;
    let want = '';
    if (path && path.length > 1) {
      const delta = path[1] - pos;
      for (let k = 0; k < cfg.n; k++) for (const sg of [-1, 1]) if (delta === sg * maze.stride[k]) {
        want = k < 2 ? ['f', 'r', 'b', 'l'][((k + (sg > 0 ? 0 : 2)) - d + 4) % 4] : k + ':' + sg;
      }
    }
    for (const b of moveButtons) {
      const act = b.dataset.act;
      if (act) { b.disabled = act === 'f' ? !maze.canMove(pos, fk, fs) : act === 'b' ? !maze.canMove(pos, fk, -fs) : false; b.classList.toggle('next', want === act); }
      else { b.disabled = !maze.canMove(pos, +b.dataset.axis, +b.dataset.sign); b.classList.toggle('next', want === b.dataset.axis + ':' + b.dataset.sign); }
    }
    if (hiddenCell >= 0) (cellSprites.get(hiddenCell) || []).forEach((sp) => { sp.visible = true; });
    (cellSprites.get(pos) || []).forEach((sp) => { sp.visible = false; }); hiddenCell = pos; // lights in your own cell would block the view
    const c = [];
    for (let k = 0; k < cfg.n; k++) c.push(maze.coord(pos, k));
    $('coord').textContent = '(' + c.join(',') + ')';
    $('steps').textContent = steps; $('best').textContent = best;
    const won = pos === goal;
    $('win').hidden = !won;
    if (won) $('winText').textContent = steps + ' 手で到達(最短 ' + best + ' 手)';
    drawMap();
  }
  function step(k, sg) {
    if (pos === goal || k >= cfg.n || !maze.canMove(pos, k, sg)) return;
    pos += sg * maze.stride[k]; steps++; visited[pos] = 1;
    if (k >= 3) { // another slice of the same place
      buildSlice(); glide(true);
      for (const [el, cls] of [[$('flash'), 'go'], [$('caption'), 'go']]) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
      $('caption').textContent = NAMES[k] + ' = ' + maze.coord(pos, k);
    } else glide(false);
    refresh();
  }
  function act(a) {
    const d = dirOf(), k = d & 1, sg = d < 2 ? 1 : -1;
    if (a === 'f') step(k, sg); else if (a === 'b') step(k, -sg);
    else { face += a === 'r' ? 1 : -1; glide(false); refresh(); }
  }

  // ---- small map of the floor you are on
  function drawMap() {
    const cvm = $('map'); cvm.hidden = !showMap;
    if (!showMap) return;
    const g = cvm.getContext('2d'), S = cvm.width, s = cfg.s, n = cfg.n, st = maze.stride, pad = 14, cell = (S - pad * 2) / s;
    g.clearRect(0, 0, S, S);
    const b0 = pos - maze.coord(pos, 0) - maze.coord(pos, 1) * st[1];
    const SPOT = [0, 0, [0, 0], [-0.28, -0.28], [0.28, -0.28], [0, 0.3]];
    for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) {
      const i = b0 + x + y * st[1], px = pad + x * cell, py = pad + y * cell;
      if (visited[i]) { g.fillStyle = 'rgba(217,58,140,0.2)'; g.fillRect(px, py, cell, cell); }
      for (let k = 2; k < n; k++) if (maze.canMove(i, k, 1) || maze.canMove(i, k, -1)) {
        g.fillStyle = AX[k]; g.beginPath(); g.arc(px + cell * (0.5 + SPOT[k][0]), py + cell * (0.5 + SPOT[k][1]), Math.max(2.5, cell * 0.09), 0, 6.3); g.fill();
      }
      if (i === goal) { g.fillStyle = '#ffffff'; g.strokeStyle = '#d18a00'; g.lineWidth = 3; g.fillRect(px + cell * 0.36, py + cell * 0.22, cell * 0.28, cell * 0.56); g.strokeRect(px + cell * 0.36, py + cell * 0.22, cell * 0.28, cell * 0.56); }
    }
    g.strokeStyle = '#3a2c58'; g.lineWidth = Math.max(3, cell * 0.08); g.lineCap = 'round'; g.beginPath();
    for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) {
      const i = b0 + x + y * st[1], px = pad + x * cell, py = pad + y * cell;
      if (x < s - 1 && !maze.canMove(i, 0, 1)) { g.moveTo(px + cell, py); g.lineTo(px + cell, py + cell); }
      if (y < s - 1 && !maze.canMove(i, 1, 1)) { g.moveTo(px, py + cell); g.lineTo(px + cell, py + cell); }
    }
    g.stroke(); g.strokeRect(pad, pad, s * cell, s * cell);
    const a = dirOf() * Math.PI / 2, cx = pad + (maze.coord(pos, 0) + 0.5) * cell, cy = pad + (maze.coord(pos, 1) + 0.5) * cell, r = cell * 0.32;
    g.fillStyle = '#3a2c58'; g.beginPath();
    g.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
    g.lineTo(cx + Math.cos(a + 2.5) * r, cy + Math.sin(a + 2.5) * r);
    g.lineTo(cx + Math.cos(a - 2.5) * r, cy + Math.sin(a - 2.5) * r);
    g.closePath(); g.fill();
  }

  // ---- input
  moveButtons.forEach((b) => b.addEventListener('click', () => (b.dataset.act ? act(b.dataset.act) : step(+b.dataset.axis, +b.dataset.sign))));
  let down = null;
  $('gl').addEventListener('pointerdown', (ev) => { down = [ev.clientX, ev.clientY]; });
  $('gl').addEventListener('pointerup', (ev) => { // swipe sideways to turn, tap to walk
    if (!down) return;
    const dx = ev.clientX - down[0], dy = ev.clientY - down[1]; down = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) act(dx < 0 ? 'r' : 'l');
    else if (Math.abs(dx) < 12 && Math.abs(dy) < 12) act('f');
  });
  const KEYS = { ArrowUp: 'f', ArrowDown: 'b', ArrowLeft: 'l', ArrowRight: 'r', w: 'f', s: 'b', a: 'l', d: 'r',
    r: [2, 1], f: [2, -1], e: [3, 1], q: [3, -1], c: [4, 1], z: [4, -1], 2: [5, 1], 1: [5, -1] };
  window.addEventListener('keydown', (ev) => {
    const m = KEYS[ev.key.length === 1 ? ev.key.toLowerCase() : ev.key];
    if (!m || ev.target.tagName === 'SELECT') return;
    ev.preventDefault();
    if (typeof m === 'string') act(m); else step(m[0], m[1]);
  });
  $('dim').addEventListener('change', () => { cfg.n = +$('dim').value; fillSelects(); build(true); });
  $('size').addEventListener('change', () => { cfg.s = +$('size').value; build(true); });
  $('algo').addEventListener('change', () => { cfg.algo = $('algo').value; build(true); });
  $('new').addEventListener('click', () => build(true));
  $('winNew').addEventListener('click', () => build(true));
  $('restart').addEventListener('click', () => build(false));
  $('winAgain').addEventListener('click', () => build(false));
  $('hint').addEventListener('click', () => { hint = !hint; $('hint').setAttribute('aria-pressed', hint); refresh(); });
  $('mapBtn').addEventListener('click', () => { showMap = !showMap; $('mapBtn').setAttribute('aria-pressed', showMap); drawMap(); });
  window.addEventListener('resize', resize);

  function start(saved) {
    if (saved && saved.cfg) Object.assign(cfg, saved.cfg);
    fillSelects(); resize();
    build(!(saved && saved.cfg), saved);
    requestAnimationFrame(frame);
  }
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => ({ cfg, pos, steps, face, trail: [...visited.keys()].filter((i) => visited[i]) }));
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
</body>
</html>
